# Mirrors the AWS origin: :80 redirects to HTTPS, :443 terminates TLS and
# proxies to the backend. Cloudflare (proxied) sits in front.
server {
    listen 80 default_server;
    server_name api.padma.io;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl default_server;
    http2 on;
    server_name api.padma.io;

    ssl_certificate     /etc/nginx/certs/api.padma.io.crt;
    ssl_certificate_key /etc/nginx/certs/api.padma.io.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    location / {
        proxy_pass http://backend:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
