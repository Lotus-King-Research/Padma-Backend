# Production stack for the Padma backend on a single Docker host.
# Deploy/update from the repo root on the server:  sh deploy/deploy.sh
# TLS cert + key for api.padma.io live outside git in /opt/padma/certs.
name: padma

services:
  backend:
    build:
      context: ..
      dockerfile: Dockerfile.render
    image: padma-backend:latest
    restart: unless-stopped
    environment:
      PORT: "5000"
    # Resource limits, measured: idle ~280 MiB; worst case (40+ concurrent
    # multi-MB queries) peaks ~540 MiB with no OOM. One uvicorn worker is
    # GIL-bound, so more than one CPU would not help.
    mem_limit: 1g
    memswap_limit: 1g                    # no swap: fail fast rather than thrash
    cpus: 1.0
    pids_limit: 256
    volumes:
      - botok-data:/root/Documents       # botok dialect pack + trie cache survive re-creates
    ports:
      - "127.0.0.1:5000:5000"            # localhost only; public traffic goes via nginx
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on: [backend]
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/api.padma.io.conf:/etc/nginx/conf.d/default.conf:ro
      - /opt/padma/certs:/etc/nginx/certs:ro
    mem_limit: 64m
    cpus: 0.5
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

volumes:
  botok-data:
