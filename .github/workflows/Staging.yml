name: Staging

on:
  pull_request:
    branches: [ master ]

# NOTE: the old AWS staging pipeline (build + push to docker.pkg.github.com,
# then SSH-deploy to an EC2 box) is retired -- GitHub's docker.pkg.github.com
# registry is gone, and the app is migrating to Render (see
# docs/Render-Migration.md). This check now lints and byte-compiles the sources.

jobs:
  staging:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
    - name: Install dependencies
      run: |
        pip install flake8
    - name: Lint with flake8
      run: |
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
    - name: Byte-compile sources
      run: |
        python -m compileall app scripts tests
